<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hari Spesialnya</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
height: 100%;
width: 100%;
overflow: hidden;
background: #100a13;
color: #ffffff;
font-family: 'Montserrat', sans-serif;
display: flex;
justify-content: center;
align-items: center;
text-align: center;
}
.section {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
opacity: 0;
pointer-events: none;
transition: opacity 1s ease-in-out;
z-index: 1;
}
.section.active {
opacity: 1;
pointer-events: auto;
z-index: 2;
}
h1 {
font-family: 'Playfair Display', serif;
font-size: 3rem;
font-weight: 300;
letter-spacing: 2px;
}
.timer-container {
display: flex;
justify-content: center;
gap: 20px;
margin-top: 30px;
}
.time-box {
background: rgba(255, 255, 255, 0.05);
padding: 15px 25px;
border-radius: 10px;
min-width: 80px;
}
.number { font-size: 2.5rem; font-weight: 700; }
.label {
font-size: 0.8rem;
text-transform: uppercase;
letter-spacing: 1px;
margin-top: 5px;
opacity: 0.7;
}
.stars {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 0;
background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
opacity: 0.8;
}
.gift-box { cursor: pointer; transition: transform 0.3s; }
.gift-box:hover { transform: scale(1.05); }
.gift-box img { width: 150px; }
.polaroid-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 20px;
max-width: 800px;
padding: 20px;
}
.polaroid {
background: #fff;
padding: 10px 10px 30px 10px;
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
transform: rotate(-2deg);
transition: transform 0.3s;
max-width: 200px;
}
.polaroid:nth-child(even) { transform: rotate(2deg); }
.polaroid:hover { transform: rotate(0deg) scale(1.05); z-index: 10; }
.polaroid img { width: 100%; height: 150px; object-fit: cover; }
.video-container { max-width: 600px; width: 90%; }
video { width: 100%; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.wishes-text { max-width: 600px; padding: 20px; font-size: 1.1rem; line-height: 1.6; }
.btn {
background: transparent;
border: 1px solid rgba(255,255,255,0.5);
color: #fff;
padding: 15px 30px;
font-size: 1rem;
text-transform: uppercase;
letter-spacing: 2px;
cursor: pointer;
margin-top: 20px;
border-radius: 5px;
transition: all 0.3s;
}
.btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }
</style>
</head>
<body>
<div class="stars"></div>
<!-- Section 1: Countdown -->
<div id="section-countdown" class="section active">
<div class="container">
<h1>Hari Spesialnya</h1>
<div class="timer-container">
<div class="time-box"><div class="number" id="days">00</div><div class="label">Hari</div></div>
<div class="time-box"><div class="number" id="hours">00</div><div class="label">Jam</div></div>
<div class="time-box"><div class="number" id="minutes">00</div><div class="label">Menit</div></div>
<div class="time-box"><div class="number" id="seconds">00</div><div class="label">Detik</div></div>
</div>
<button class="btn" onclick="nextSection('section-gift')">Buka</button>
</div>
</div>
<!-- Section 2: Gift Box -->
<div id="section-gift" class="section">
<div class="container">
<div class="gift-box" onclick="nextSection('section-memories')">
<img src="https://cdn-icons-png.flaticon.com/512/3652/3652646.png" alt="Kotak Kado">
<p style="margin-top: 20px; letter-spacing: 2px;">Klik untuk membuka</p>
</div>
</div>
</div>
<!-- Section 3: Photo Gallery -->
<div id="section-memories" class="section">
<div class="container" style="overflow-y: auto; max-height: 100vh; padding: 50px 0;">
<h1 style="margin-bottom: 30px;">Kenangan Kita</h1>
<div class="polaroid-grid">
<div class="polaroid"><img src="https://via.placeholder.com/300" alt="Foto 1"></div>
<div class="polaroid"><img src="https://via.placeholder.com/300" alt="Foto 2"></div>
<div class="polaroid"><img src="https://via.placeholder.com/300" alt="Foto 3"></div>
<div class="polaroid"><img src="https://via.placeholder.com/300" alt="Foto 4"></div>
<div class="polaroid"><img src="https://via.placeholder.com/300" alt="Foto 5"></div>
<div class="polaroid"><img src="https://via.placeholder.com/300" alt="Foto 6"></div>
</div>
<button class="btn" onclick="nextSection('section-video')">Lanjut</button>
</div>
</div>
<!-- Section 4: Video Player -->
<div id="section-video" class="section">
<div class="video-container">
<h1>Sebuah Momen Untukmu</h1>
<video controls>
<source src="https://www.w3schools.com/tags/mov_bbb.mp4" type="video/mp4">
Browser Anda tidak mendukung tag video.
</video>
<button class="btn" onclick="nextSection('section-wishes')">Lanjut</button>
</div>
</div>
<!-- Section 5: Birthday Wishes -->
<div id="section-wishes" class="section">
<div class="container">
<h1>Selamat Ulang Tahun!</h1>
<div class="wishes-text">
<p>Semoga harimu dipenuhi dengan kebahagiaan, tawa, dan cinta. Terima kasih telah menjadi bagian dari hidupku. Aku sangat mencintaimu.</p>
</div>
<button class="btn" onclick="location.reload()">Mulai Kembali</button>
</div>
</div>
<script>
function nextSection(nextId) {
document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
document.getElementById(nextId).classList.add('active');
}
// Countdown timer logic
const countDownDate = new Date().getTime() + (5 * 24 * 60 * 60 * 1000); // 5 days from now
const x = setInterval(function() {
const now = new Date().getTime();
const distance = countDownDate - now;
const days = Math.floor(distance / (1000 * 60 * 60 * 24));
const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((distance % (1000 * 60)) / 1000);
document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');
if (distance < 0) {
clearInterval(x);
document.getElementById("section-countdown").innerHTML = "<h1>Waktunya Telah Tiba!</h1>";
}
}, 1000);
</script>
</body>
</html>
